
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fitness Football League</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <img src="FFC_logo.png" alt="FFC Logo">
    </header>
    <main>
        <h1>Welcome to Fitness Football League</h1>
        <p>Push your limits. Track your scores. Compete with the best.</p>

        <iframe src="https://www.youtube.com/embed/3SzcMGG3hlA" allowfullscreen></iframe>

        <form action="https://formsubmit.co/shaundoxey@yahoo.com" method="POST">
            <h2>Contact Us</h2>
            <label for="name">Name</label>
            <input type="text" name="name" required>

            <label for="email">Email</label>
            <input type="email" name="email" required>

            <label for="message">Message</label>
            <textarea name="message" rows="5" required></textarea>

            <button type="submit">Send</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 Fitness Football League</p>
    </footer>
</body>
</html>
